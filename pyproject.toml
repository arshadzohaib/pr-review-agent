# Tool configuration only. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: requires a reachable Docker daemon (sandbox integration tests)",
    "e2e: end-to-end tests against real GitHub/Gemini (opt-in, manual)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = false
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "unidiff",
    "unidiff.*",
    "fakeredis",
    "fakeredis.*",
    "tree_sitter",
    "tree_sitter.*",
    "tree_sitter_python",
    "tree_sitter_python.*",
    "docker",
    "docker.*",
]
ignore_missing_imports = true
