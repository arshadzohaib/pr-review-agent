name: pr-agent

# Single-command full application stack deployment:
#   docker-compose up --build -d
#
# Services:
#   1. redis: Redis 7.4-alpine state store (locks, queues, SHA diff cache, rate limiter)
#   2. sandbox-image: Seeds the hardened offline Python 3.11 test runner image (runs once and exits 0)
#   3. api: FastAPI webhook server listening on port 8000
#   4. worker: Background review worker loop processing PR events with Docker sandbox verification

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: pr-agent-sandbox-python:3.11
    profiles: ["build"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      # DooD (Docker-out-of-Docker) socket to allow worker to create sibling sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared tmp directory for ephemeral test workspaces mounted into sandbox containers
      - /tmp:/tmp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
